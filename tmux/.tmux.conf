# Prefix and reload
unbind C-b
set -g prefix C-s
bind C-s send-prefix
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Terminal capabilities and responsiveness
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"
set -s extended-keys on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 100000
set -g mouse on
set -s set-clipboard on

# Start window and pane numbering at 1 and close numbering gaps
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep new shells in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use the same resize and swap keys in tmux and Neovim. When Neovim is
# running in the pane, tmux forwards the key instead of handling it.
set -g @vim_navigator_check "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

bind -n C-Left if-shell "#{E:@vim_navigator_check}" "send-keys C-Left" "resize-pane -L 2"
bind -n C-Right if-shell "#{E:@vim_navigator_check}" "send-keys C-Right" "resize-pane -R 2"
bind -n C-Up if-shell "#{E:@vim_navigator_check}" "send-keys C-Up" "resize-pane -U 2"
bind -n C-Down if-shell "#{E:@vim_navigator_check}" "send-keys C-Down" "resize-pane -D 2"

# Remove the previous swap bindings when reloading an existing tmux server.
unbind -n C-S-Left
unbind -n C-S-Right
unbind -n C-S-Up
unbind -n C-S-Down
unbind S-Left
unbind S-Right
unbind S-Up
unbind S-Down

unbind -n M-S-Left
unbind -n M-S-Right
unbind -n M-S-Up
unbind -n M-S-Down

unbind -q -a -T pane-swap

# Capture the prefix synchronously, then route the entire sequence together.
# This avoids a race between process detection and the following arrow.
bind -n C-g switch-client -T pane-swap
bind -T pane-swap Left if-shell "#{E:@vim_navigator_check}" { send-keys C-g Left } { if-shell -F '#{pane_at_left}' {} { run-shell "tmux swap-pane -d -s '#{pane_id}' -t '#{window_id}.{left-of}'" } }
bind -T pane-swap Right if-shell "#{E:@vim_navigator_check}" { send-keys C-g Right } { if-shell -F '#{pane_at_right}' {} { run-shell "tmux swap-pane -d -s '#{pane_id}' -t '#{window_id}.{right-of}'" } }
bind -T pane-swap Up if-shell "#{E:@vim_navigator_check}" { send-keys C-g Up } { if-shell -F '#{pane_at_top}' {} { run-shell "tmux swap-pane -d -s '#{pane_id}' -t '#{window_id}.{up-of}'" } }
bind -T pane-swap Down if-shell "#{E:@vim_navigator_check}" { send-keys C-g Down } { if-shell -F '#{pane_at_bottom}' {} { run-shell "tmux swap-pane -d -s '#{pane_id}' -t '#{window_id}.{down-of}'" } }
bind -T pane-swap Escape switch-client -T root
bind -T pane-swap C-g switch-client -T root
bind -T pane-swap Any switch-client -T root

# Vim-style copy mode; tmux forwards copied text to the terminal clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Windows and status line
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100
setw -g automatic-rename off
set -g allow-rename off

# Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Session persistence
set -g @continuum-restore "on"

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "catppuccin/tmux#v2.1.0"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

run "~/.tmux/plugins/tpm/tpm"

# Keep the terminal background visible behind the status line
set -g status-style bg=default
